<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{LESSON_TITLE}} — 학습지</title>

  <!-- ────────────────────────────────────────────────────────────
       lesson-maker 디자인 시스템
       ─────────────────────────────────────────────────────────── -->
  <link rel="stylesheet" href="../../_shared/templates/design-tokens.css">
  <link rel="stylesheet" href="../../_shared/templates/worksheet-system.css">

  <!-- ────────────────────────────────────────────────────────────
       MathJax 3.x (인쇄 최적화 설정)
       ─────────────────────────────────────────────────────────── -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        packages: { '[+]': ['boldsymbol', 'ams'] },
        tags: 'ams'
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea'] },
      chtml: { scale: 0.95 }
    };
    window.safeTypeset = function(elements) {
      if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
        return MathJax.typesetPromise(elements ? [].concat(elements) : undefined);
      }
      return Promise.resolve();
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" async></script>
</head>

<body data-subject="{{SUBJECT_KEY}}">

       각 페이지는 <div class="ws-page">로 감싼다.

</body>
</html>
