<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{LESSON_TITLE}} | {{SUBJECT}} {{GRADE}}</title>

  <!-- ────────────────────────────────────────────────────────────
       Reveal.js (CDN)
       ─────────────────────────────────────────────────────────── -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reset.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.css">

  <!-- ────────────────────────────────────────────────────────────
       MathJax 3.x (CDN)
       ─────────────────────────────────────────────────────────── -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        packages: { '[+]': ['boldsymbol', 'ams'] },
        tags: 'ams'
      },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre'] },
      startup: {
        typeset: false,
        ready: () => {
          MathJax.startup.defaultReady();
          window.mathJaxReady = true;
        }
      },
      chtml: { scale: 1.0 }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>

  <!-- ────────────────────────────────────────────────────────────
       외부 라이브러리 (CDN)
       ─────────────────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- ────────────────────────────────────────────────────────────
       lesson-maker 디자인 시스템
       ─────────────────────────────────────────────────────────── -->
  <link rel="stylesheet" href="../../_shared/templates/design-tokens.css">
  <link rel="stylesheet" href="../../_shared/templates/slide-system.css">

  <style>
    /* Reveal.js 캔버스 & 뷰포트 오버라이드 (고정 1920×1080) */
    html, body { background: var(--lm-paper); }
    .reveal-viewport { background: var(--lm-paper); }
  </style>
</head>

<body data-subject="{{SUBJECT_KEY}}">

  <div class="reveal">
    <div class="slides">

      <!-- ══════════════════════════════════════════════════════════
           슬라이드 섹션은 slide_creator 에이전트가 생성하여
           아래 플레이스홀더를 치환한다
           ══════════════════════════════════════════════════════════ -->
      {{SLIDES_HTML}}

    </div>
  </div>


  <!-- ────────────────────────────────────────────────────────────
       Reveal.js 초기화 (고정 크기 · 상단 정렬 · 업스케일 금지)
       ─────────────────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/reveal.js@4.6.1/dist/reveal.js"></script>
  <script>
    Reveal.initialize({
      /* ── 캔버스 고정 ── */
      width:  1920,
      height: 1080,
      margin: 0.04,
      minScale: 0.2,   /* 작은 뷰포트에서 비례 축소만 허용 */
      maxScale: 1.0,   /* 1920보다 큰 뷰포트에서도 업스케일 안 함 */

      /* ── 레이아웃 ── */
      center: false,   /* 상단 정렬 (자동 수직 센터링 없음) */

      /* ── UI ── */
      hash: true,
      slideNumber: 'c/t',
      progress: true,
      controls: true,
      controlsLayout: 'bottom-right',

      /* ── 전환 ── */
      transition: 'fade',
      transitionSpeed: 'default',
      backgroundTransition: 'fade',

      /* ── 입력 ── */
      touch: true,
      keyboard: {
        /* N: 현재 슬라이드의 수학 애니메이션 다음 단계 */
        78: () => {
          const currentSlide = Reveal.getCurrentSlide();
          const animId = currentSlide && currentSlide.dataset.animId;
          if (animId && window.mathAnimators && window.mathAnimators[animId]) {
            window.mathAnimators[animId].next();
          }
        },
        /* P: 이전 단계 */
        80: () => {
          const currentSlide = Reveal.getCurrentSlide();
          const animId = currentSlide && currentSlide.dataset.animId;
          if (animId && window.mathAnimators && window.mathAnimators[animId]) {
            window.mathAnimators[animId].prev();
          }
        }
      },
      plugins: []
    });

    /* MathJax 안전 호출 유틸 (에이전트 생성 코드에서 공통 사용) */
    window.safeTypeset = function(elements) {
      if (typeof MathJax !== 'undefined' && MathJax.typesetPromise) {
        return MathJax.typesetPromise(elements ? [].concat(elements) : undefined);
      }
      return Promise.resolve();
    };

    Reveal.on('slidechanged', () => window.safeTypeset());
    Reveal.on('ready', () => {
      window.safeTypeset();

      /* code-block data-highlight-lines 처리 */
      document.querySelectorAll('.code-block[data-highlight-lines]').forEach(pre => {
        const ranges = new Set();
        pre.dataset.highlightLines.split(',').forEach(part => {
          part = part.trim();
          if (part.includes('-')) {
            const [a, b] = part.split('-').map(Number);
            for (let i = a; i <= b; i++) ranges.add(i);
          } else {
            ranges.add(Number(part));
          }
        });
        pre.querySelectorAll('.line').forEach((line, i) => {
          if (ranges.has(i + 1)) line.classList.add('line--highlight');
        });
        if (ranges.size > 0) pre.classList.add('dim-others');
      });
    });
  </script>

  <!-- ────────────────────────────────────────────────────────────
       MathStepAnimator · NeuralNetDiagram 라이브러리
       ─────────────────────────────────────────────────────────── -->
  <script src="../../_shared/templates/math_animation_lib.js"></script>

  <!-- ────────────────────────────────────────────────────────────
       슬라이드별 인라인 스크립트 (math_animator·visual_creator 생성)
       ─────────────────────────────────────────────────────────── -->
  {{INLINE_SCRIPTS}}

</body>
</html>
